name: Build & Release Pilgrim Cleaner

# Releasing = pushing a version tag:
#   git tag v1.2.0
#   git push origin v1.2.0
# This workflow then builds, tests and packages Pilgrim Cleaner and publishes a GitHub Release with:
#   - PilgrimCleanerSetup.exe                    (Inno Setup installer, machine-wide)
#   - PilgrimCleaner-v1.2.0-Windows-x64.zip       (portable GUI + CLI, no install)
#   - SHA256SUMS.txt
# Updated winget manifests (version + installer hash) are attached to the workflow run as an artifact.
# A manual run (workflow_dispatch) builds everything with version 0.0.0 but does not publish a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package Windows Installers
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create the GitHub Release

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Determine Release Version
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Tag "v1.2.0" -> "1.2.0". Manual runs on a branch get a placeholder version.
          $ver = $env:REF_NAME -replace '^v', ''
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { $ver = '0.0.0' }
          "value=$ver" >> $env:GITHUB_OUTPUT

      - name: Run Architecture & End-User Audit Test Suite
        run: |
          dotnet run --project Tests/PilgrimCleaner.Tests.csproj -c Release
          dotnet run --project Tests/PilgrimCleaner.Tests.csproj -c Release -- --user-audit

      # There is no official Inno Setup GitHub Action; install the ISCC compiler if the runner image lacks it.
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }

      # Same script as for local builds: publishes GUI + CLI (framework-dependent, .NET 10 Desktop
      # Runtime patched by Microsoft Update), creates the portable ZIP and compiles the installer.
      - name: Build Release Packages
        shell: pwsh
        run: ./build-release.ps1 -Version '${{ steps.version.outputs.value }}' -RequireInstaller

      - name: Write Checksums & Winget Manifests
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.value }}'
          $setup = 'dist/installer/PilgrimCleanerSetup.exe'
          $zip = "dist/PilgrimCleaner-v$ver-Windows-x64.zip"

          $lines = foreach ($file in $setup, $zip) {
            '{0}  {1}' -f (Get-FileHash $file -Algorithm SHA256).Hash, (Split-Path $file -Leaf)
          }
          Set-Content dist/SHA256SUMS.txt $lines
          Get-Content dist/SHA256SUMS.txt

          # Winget manifests for this release, ready to submit to microsoft/winget-pkgs.
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash
          $url = "https://github.com/${{ github.repository }}/releases/download/v$ver/PilgrimCleanerSetup.exe"
          New-Item -ItemType Directory -Force dist/winget | Out-Null
          foreach ($manifest in Get-ChildItem winget/*.yaml) {
            $text = Get-Content $manifest.FullName -Raw
            $text = $text -replace '(?m)^PackageVersion:.*$', "PackageVersion: $ver"
            $text = $text -replace '(?m)^(\s+DisplayVersion:).*$', "`$1 $ver"
            $text = $text -replace '(?m)^(\s+InstallerUrl:).*$', "`$1 $url"
            $text = $text -replace '(?m)^(\s+InstallerSha256:).*$', "`$1 $setupHash"
            Set-Content (Join-Path dist/winget $manifest.Name) $text -NoNewline
          }

      - name: Upload Winget Manifests
        uses: actions/upload-artifact@v6
        with:
          name: winget-manifests-${{ steps.version.outputs.value }}
          path: dist/winget/

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/installer/PilgrimCleanerSetup.exe
            dist/PilgrimCleaner-v${{ steps.version.outputs.value }}-Windows-x64.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
