name: Build & Release Pilgrim Cleaner

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package Windows Installers
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create the GitHub Release

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine Release Version
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Tag "v1.2.0" -> "1.2.0". Manual runs on a branch get a placeholder version.
          $ver = $env:REF_NAME -replace '^v', ''
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { $ver = '0.0.0' }
          "value=$ver" >> $env:GITHUB_OUTPUT

      - name: Restore NuGet Packages
        run: dotnet restore PilgrimCleaner.csproj

      - name: Run Architecture & End-User Audit Test Suite
        run: |
          dotnet run --project Tests/PilgrimCleaner.Tests.csproj
          dotnet run --project Tests/PilgrimCleaner.Tests.csproj -- --user-audit

      - name: Publish Pilgrim Cleaner Application
        run: |
          dotnet publish PilgrimCleaner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist/PilgrimCleaner

      - name: Prepare Installer Assets & Documentation
        shell: pwsh
        run: |
          Copy-Item "installer/Install.bat" -Destination "dist/PilgrimCleaner/" -Force
          Copy-Item "installer/Install-PilgrimCleaner.ps1" -Destination "dist/PilgrimCleaner/" -Force
          Copy-Item "README.md" -Destination "dist/PilgrimCleaner/" -Force
          Copy-Item "LICENSE" -Destination "dist/PilgrimCleaner/" -Force

      - name: Create Portable ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/PilgrimCleaner/*" -DestinationPath "dist/PilgrimCleaner-v${{ steps.version.outputs.value }}-Portable.zip" -CompressionLevel Optimal

      # There is no official Inno Setup GitHub Action; call the ISCC compiler directly
      # (installed via Chocolatey if the runner image does not ship it).
      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.value }}" installer/PilgrimCleaner.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/installer/PilgrimCleaner-Setup-*.exe
            dist/PilgrimCleaner-*-Portable.zip
          draft: false
          prerelease: false
          generate_release_notes: true
