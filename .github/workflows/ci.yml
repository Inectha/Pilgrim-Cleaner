name: CI

# Builds all projects and runs the architecture test suite on every pull request
# and on every push to main, so regressions are caught before a release.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build GUI
        run: dotnet build PilgrimCleaner.csproj -c Release

      - name: Build CLI
        run: dotnet build cli/PilgrimCli.csproj -c Release

      - name: Build Tests
        run: dotnet build Tests/PilgrimCleaner.Tests.csproj -c Release

      # Only the architecture suite runs here. The --user-audit suite changes real
      # system state (it registers a scheduled task and toggles a startup entry),
      # so it is kept to the release workflow on a throwaway runner.
      - name: Run Architecture Test Suite
        run: dotnet run --project Tests/PilgrimCleaner.Tests.csproj -c Release --no-build

  # Builds the release packages (portable ZIP + installer) exactly like a release would,
  # so a broken installer script is caught in the pull request instead of at release time.
  package:
    name: Package (installer smoke test)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }

      - name: Build Release Packages
        shell: pwsh
        run: ./build-release.ps1 -Version 0.0.0 -RequireInstaller
